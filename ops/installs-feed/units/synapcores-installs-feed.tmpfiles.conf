# /etc/tmpfiles.d/synapcores-installs-feed.conf
# Drop directory for the installs feed: written by the export job (bitnami), read by mktperf-app.
# setgid so new files inherit the mktperf-app group; mktperf-app can read but not create, replace or delete.
d /var/lib/synapcores-installs-feed 2750 bitnami mktperf-app -
